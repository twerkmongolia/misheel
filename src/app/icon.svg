<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Twerk Mongolia</title>

  <!--
    ЦАГААН хавтан, ХАР тэмдэг — удирдлага ба сурагчийн самбар дээрх «TM»
    тэмдэгтэй яг ижил (§ admin/AdminShell.tsx). Сайт өөрөө харанхуй ч
    favicon нь ЭСРЭГЭЭР байх ёстой: хөтчийн таб ихэвчлэн цайвар бөгөөд хар
    дэвсгэртэй дүрс тэнд нүх мэт харагдана. Цагаан хавтан хоёр горимд ч
    өөрийн хэлбэрээ хадгална.

    Үсгийг ФОНТООР биш ЗУРЛАГААР зурсан: favicon нь хэрэглэгчийн
    төхөөрөмж дээр зурагддаг ба тэнд Manrope байхгүй. `<text>` ашигласан
    бол үсэг нь хөтөч бүр дээр өөр өнгөтэй, зарим дээр огт гарахгүй.

    16px дээр хоёр үсэг нягт боловч уншигдана: зурлага 2.6 нэгж (~1.3px)
    бөгөөд үсэг хоорондын зай нь тэр зузаанаас өргөн.
  -->
  <rect width="32" height="32" rx="7" fill="#FFFFFF" />

  <g
    fill="none"
    stroke="#0D0D0D"
    stroke-width="2.6"
    stroke-linecap="square"
    stroke-linejoin="miter"
  >
    <!-- T -->
    <path d="M5.5 10.2h8M9.5 10.2V22" />
    <!-- M -->
    <path d="M17.5 22V10.2L22 17l4.5-6.8V22" />
  </g>
</svg>
